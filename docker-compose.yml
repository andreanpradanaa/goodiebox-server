services:
  db:
    image: postgres:16-alpine
    container_name: goodiebox-server-db
    environment:
      POSTGRES_USER: goodiebox
      POSTGRES_PASSWORD: goodiebox
      POSTGRES_DB: goodiebox
    ports:
      - "5433:5432"
    volumes:
      - goodiebox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodiebox -d goodiebox"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  goodiebox_pgdata:
